<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maestro Games</title>

<style>
:root{
  --bg:#0b0c10;
  --panel:#141622;
  --panel2:#1b1f2e;
  --accent:#4da3ff;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --radius:20px;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}

body{
  background:linear-gradient(180deg,#090a0f,#0b0c10);
  color:var(--text);
}

/* HEADER */
header{
  padding:70px 20px;
  text-align:center;
  background:radial-gradient(circle at top,#1e293b,#0b0c10);
}
header h1{
  font-size:clamp(2.4rem,5vw,3.6rem);
}
header p{
  margin-top:16px;
  color:var(--muted);
}

/* SECTIONS */
section{
  max-width:1100px;
  margin:60px auto;
  padding:0 20px;
}
h2{
  margin-bottom:24px;
}

/* GAME GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:24px;
}

.card{
  background:var(--panel);
  padding:22px;
  border-radius:var(--radius);
  cursor:pointer;
  transition:.25s;
}
.card:hover{
  transform:translateY(-6px);
  box-shadow:0 0 40px rgba(77,163,255,.15);
}
.card h3{
  margin-bottom:10px;
}
.card p{
  color:var(--muted);
  font-size:.95rem;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
}
.stat{
  background:var(--panel2);
  padding:22px;
  border-radius:18px;
  text-align:center;
}
.stat strong{
  font-size:1.9rem;
  display:block;
}
.stat span{
  color:var(--muted);
  font-size:.85rem;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:100;
}
.modal-content{
  background:var(--panel);
  width:90%;
  max-width:420px;
  max-height:85vh;
  overflow:auto;
  padding:26px;
  border-radius:var(--radius);
}
.modal-content h3{
  margin-bottom:10px;
}
.modal-content p{
  color:var(--muted);
  margin-bottom:14px;
}
.modal-content a{
  display:block;
  margin-top:14px;
  background:var(--accent);
  color:#000;
  padding:14px;
  border-radius:14px;
  text-align:center;
  font-weight:700;
  text-decoration:none;
}
.close{
  margin-top:18px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:999px;
  background:#1f2937;
  color:var(--text);
  cursor:pointer;
}

/* FOOTER */
footer{
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
  font-size:.85rem;
}
</style>
</head>

<body>

<header>
  <h1>Maestro Games</h1>
  <p>Juegos simples, ideas raras y cero sentido común.</p>
</header>

<section>
  <h2>Juegos</h2>
  <div class="grid">
    <div class="card" onclick="openGame('clicker')">
      <h3>Casual Clicker</h3>
      <p>Haz click sin motivo alguno.</p>
    </div>

    <div class="card" onclick="openGame('future')">
      <h3>???</h3>
      <p>Algo viene… probablemente mala idea.</p>
    </div>
  </div>
</section>

<section>
  <h2>Estadísticas</h2>
  <div class="stats">
    <div class="stat">
      <strong>137</strong>
      <span>Jugadores activos</span>
    </div>
    <div class="stat">
      <strong>8.2k</strong>
      <span>Clicks hoy</span>
    </div>
    <div class="stat">
      <strong>97%</strong>
      <span>Reseñas positivas</span>
    </div>
  </div>
</section>

<footer>
© 2026 Maestro Games — un dev, cero presupuesto.
</footer>

<!-- MODAL -->
<div class="modal" id="gameModal">
  <div class="modal-content" id="modalContent"></div>
</div>

<script>
function openGame(game){
  const modal=document.getElementById("gameModal");
  const box=document.getElementById("modalContent");

  if(game==="clicker"){
    box.innerHTML=`
      <h3>Casual Clicker</h3>
      <p>
        Un juego donde solo haces click.<br>
        Sin historia. Sin final. Sin sentido.
      </p>
      <p>
        ✔ 97% reseñas positivas<br>
        ✔ Disponible en móvil<br>
        ✔ Gratis
      </p>
      <a href="https://maestro-gato12.itch.io/casual-clicker" target="_blank">
        Jugar en itch.io
      </a>
      <button class="close" onclick="closeModal()">Cerrar</button>
    `;
  }

  if(game==="future"){
    box.innerHTML=`
      <h3>???</h3>
      <p>
        Próximo proyecto secreto.<br>
        No hay imágenes.<br>
        No hay fecha exacta.
      </p>
      <p>
        Lanzamiento estimado: 2026
      </p>
      <button class="close" onclick="closeModal()">Cerrar</button>
    `;
  }

  modal.style.display="flex";
}

function closeModal(){
  document.getElementById("gameModal").style.display="none";
}
</script>

</body>
</html>
